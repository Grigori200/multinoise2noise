# @package _global_
defaults:
  - override /datamodule: "10948"
  - override /lightning_model: multinoise2noise_patch
  - override /model: swinir
  - override /trainer: gpu
  - override /callbacks: default_reconstruction
  - override /logger: wandb
  

core:
  group: noise2noise

trainer:
  min_epochs: 20
  max_epochs: 500

datamodule:
  splits: 2
  batch_size: 8
  num_workers: 8
  particles_star_path: "${datamodule.dataset_path}/${datamodule.dataset_name}_subset.star"
  original_reconstruction_path: "${datamodule.dataset_path}/half_1_reconstruction.mrc"

lightning_model:
  metrics:
    _target_: torchmetrics.MetricCollection
    metrics: []
  patch_size: 128
  patch_overlap: 16
  patch_batch_size: 1

tags: ['noise2noise', 'unet', '10948', 'real']

task_name: "noise2noise"
